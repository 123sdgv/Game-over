<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>假条模拟器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="win95-window" id="win">
    <!-- 顶部深蓝色标题栏 -->
    <div class="title-bar">
      <div class="title-bar-text">📄 假条模拟器.exe</div>
      <div class="title-bar-controls">
        <button aria-label="最小化" id="btn-min">_</button>
        <button aria-label="最大化" id="btn-max">□</button>
        <button aria-label="关闭" id="btn-close">×</button>
      </div>
    </div>

    <!-- 窗口主体内容 -->
    <div class="window-body">
      <div class="label-text">当前可用假条数量：</div>
      <!-- 凹陷风格的大数字显示屏 -->
      <div class="display-screen" id="screen">
        <span id="counter">0</span>
      </div>
      <!-- 加减按钮区 -->
      <div class="button-group">
        <button id="btn-minus" class="win95-btn">➖</button>
        <button id="btn-plus" class="win95-btn">➕</button>
      </div>
    </div>

    <!-- 底部状态栏：实时时间和每周自动加的规则 -->
    <div class="status-bar">
      <div class="status-field" id="current-time">正在获取系统时间...</div>
      <div class="status-field" id="rule-tip">每周一 +2</div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
