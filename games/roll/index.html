<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>滚滚球</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="menu-on">
  <canvas id="cv"></canvas>
  <canvas id="fx"></canvas>
  <div class="flash" id="flash"></div>

  <header class="hud" id="hud">
    <div class="left">
      <div class="score" id="score">0</div>
      <div class="sub" id="sub">0 米</div>
    </div>
    <div class="right">
      <div class="coins" id="coinBox"><i class="coin"></i><span id="coins">0</span></div>
      <button class="pause" id="pause" aria-label="暂停"><svg viewBox="0 0 20 20"><rect x="5.5" y="4.5" width="3" height="11" rx="1.2" fill="currentColor"/><rect x="11.5" y="4.5" width="3" height="11" rx="1.2" fill="currentColor"/></svg></button>
    </div>
    <div class="prog" id="prog"><i id="progFill"></i><b id="progDot"></b></div>
  </header>

  <div class="count" id="count"></div>

  <div class="menu" id="menu">
    <div class="menu-top">
      <div class="menu-title">滚滚球</div>
      <div class="menu-sub" id="menuSub"></div>
    </div>
    <div class="menu-bottom">
      <button class="btn main" id="goLevel">闯关 · 第 <span id="lvNum">1</span> 关</button>
      <button class="btn ghost" id="goEndless">无尽模式</button>
    </div>
  </div>

  <div class="card-wrap" id="cardWrap" hidden>
    <div class="card">
      <div class="card-title" id="cardTitle"></div>
      <div class="card-big" id="cardBig"></div>
      <div class="card-meta" id="cardMeta"></div>
      <div class="card-row">
        <button class="card-btn ghost" id="cardAlt"></button>
        <button class="card-btn" id="cardMain"></button>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
