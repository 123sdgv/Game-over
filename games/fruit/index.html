<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>切水果</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="cv"></canvas>

  <header class="hud" id="hud">
    <div class="left">
      <div class="score" id="scoreBox">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 12a13 13 0 0 0 26 0z" fill="#2E7D22"/><path d="M5.2 12a10.8 10.8 0 0 0 21.6 0z" fill="#F4F9DC"/><path d="M6.6 12a9.4 9.4 0 0 0 18.8 0z" fill="#F23B4E"/><circle cx="11" cy="16" r="1.1" fill="#1C0F08"/><circle cx="16" cy="19" r="1.1" fill="#1C0F08"/><circle cx="21" cy="16" r="1.1" fill="#1C0F08"/></svg>
        <span id="score">0</span>
      </div>
      <div class="best" id="best"></div>
      <div class="goal" id="goal" hidden><span id="goalText"></span><div class="meter"><i id="meter"></i></div></div>
    </div>
    <div class="right">
      <button class="pause" id="pause" aria-label="暂停"><svg viewBox="0 0 20 20"><rect x="5.5" y="4.5" width="3" height="11" rx="1.2" fill="currentColor"/><rect x="11.5" y="4.5" width="3" height="11" rx="1.2" fill="currentColor"/></svg></button>
      <div class="lives" id="lives"></div>
      <div class="timer" id="timer"></div>
      <div class="fx" id="fx"></div>
    </div>
  </header>

  <div class="menu" id="menu">
    <div class="menu-title">切水果</div>
    <div class="seg" id="seg" role="radiogroup" aria-label="玩法">
      <i class="seg-knob"></i>
      <button role="radio" id="segLevels" aria-checked="true">闯关</button>
      <button role="radio" id="segArcade" aria-checked="false">限时</button>
    </div>
    <div class="menu-info" id="menuInfo"></div>
    <div class="menu-hint" id="menuHint">划一刀开始</div>
  </div>

  <div class="card-wrap" id="cardWrap" hidden>
    <div class="card">
      <div class="card-title" id="cardTitle"></div>
      <div class="card-big" id="cardBig"></div>
      <div class="card-meta" id="cardMeta"></div>
      <div class="card-row">
        <button class="card-btn ghost" id="cardAlt"></button>
        <button class="card-btn" id="cardMain"></button>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
