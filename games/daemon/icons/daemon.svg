<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg-daemon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#EEF0F3"/></linearGradient>
    <linearGradient id="case-daemon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF8EF"/><stop offset="1" stop-color="#CFC6B1"/></linearGradient>
    <linearGradient id="side-daemon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E9E2D0"/><stop offset="1" stop-color="#B9AF98"/></linearGradient>
    <radialGradient id="scr-daemon" cx=".45" cy=".4" r=".75"><stop offset="0" stop-color="#2F5FC4"/><stop offset=".7" stop-color="#12307E"/><stop offset="1" stop-color="#0A1C4E"/></radialGradient>
    <linearGradient id="glare-daemon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="sh-daemon" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".22"/></filter>
  </defs>
  <rect width="120" height="120" fill="url(#bg-daemon)"/>
  <g filter="url(#sh-daemon)">
    <!-- 底座 -->
    <path d="M44 86h32l4 9H40z" fill="url(#side-daemon)" stroke="#5A5446" stroke-width="2" stroke-linejoin="round"/>
    <rect x="30" y="94" width="60" height="9" rx="3" fill="url(#case-daemon)" stroke="#5A5446" stroke-width="2"/>
    <rect x="72" y="97.5" width="9" height="2.4" rx="1.2" fill="#3FBF5A"/>
    <!-- 显示器 -->
    <rect x="17" y="18" width="86" height="70" rx="9" fill="url(#case-daemon)" stroke="#5A5446" stroke-width="2.2"/>
    <rect x="26" y="26" width="68" height="52" rx="5" fill="url(#scr-daemon)" stroke="#2A2722" stroke-width="2"/>
    <!-- 屏幕上的提示符 -->
    <path d="M36 42l10 8-10 8" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="52" y="56" width="15" height="4.6" rx="1.2" fill="#FFD34D"/>
    <!-- 一颗小小的心 -->
    <path d="M80 35.5c-1.6-2.6-5.6-1.8-5.6 1.2 0 2.5 3.4 4.6 5.6 6.3 2.2-1.7 5.6-3.8 5.6-6.3 0-3-4-3.8-5.6-1.2z" fill="#FF6FA0"/>
    <path d="M27.5 27.5h40l-41 30z" fill="url(#glare-daemon)"/>
    <circle cx="94" cy="82.5" r="2" fill="#3FBF5A"/>
  </g>
