<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>倒水</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="pill" id="level">第 1 关</div>
    <div class="moves" id="moves">0 步</div>
    <button class="pill round" id="restart" aria-label="重来这一关">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 10a5.5 5.5 0 1 1-1.7-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M14.6 2.6v3.8h-3.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>
  <div class="notice" id="notice" hidden>新设置会在下一关生效</div>

  <main class="stage" id="stage">
    <div class="shelf" id="shelf"></div>
  </main>
  <i class="stream" id="stream" aria-hidden="true"></i>

  <footer class="foot">
    <div class="tools">
      <button class="tool" id="undo" disabled>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 5.5L4 9l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 9h7a4.5 4.5 0 0 1 0 9H9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>撤销
      </button>
      <button class="tool" id="add">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5.5" y="5" width="9" height="12.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 2.5h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M10 8.5v5.5M7.25 11.25h5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>加空瓶
      </button>
    </div>
    <p class="tip" id="tip">点一个瓶子，再点另一个瓶子倒进去</p>
  </footer>

  <div class="result" id="result" hidden>
    <div class="result-card">
      <div class="result-title">倒好了</div>
      <div class="result-big" id="resultLevel">第 1 关</div>
      <div class="result-meta" id="resultMeta"></div>
      <button class="result-btn" id="next">下一关</button>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
