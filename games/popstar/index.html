<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>消灭星星</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="pill" id="score">0</div>
    <div class="seg" id="seg" role="radiogroup" aria-label="玩法">
      <i class="seg-knob"></i>
      <button role="radio" id="segLevels" aria-checked="true">闯关</button>
      <button role="radio" id="segInf" aria-checked="false">无尽</button>
    </div>
    <button class="pill round" id="restart" aria-label="重新开始">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 10a5.5 5.5 0 1 1-1.7-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M14.6 2.6v3.8h-3.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <div class="sub">
    <div class="goal" id="goal"></div>
    <div class="meter"><i id="meter"></i></div>
    <div class="steps" id="steps" aria-hidden="true"></div>
  </div>

  <main class="stage" id="stage"><canvas id="board"></canvas></main>

  <footer class="foot">
    <p class="tip" id="tip">点一组相连的同色星星，再点一下消掉</p>
  </footer>

  <div class="banner" id="banner" hidden>
    <div class="banner-title" id="bannerTitle"></div>
    <div class="banner-sub" id="bannerSub"></div>
  </div>

  <div class="card-wrap" id="cardWrap" hidden>
    <div class="card">
      <div class="card-title" id="cardTitle"></div>
      <div class="card-big" id="cardBig"></div>
      <div class="card-meta" id="cardMeta"></div>
      <div class="card-row">
        <button class="card-btn ghost" id="cardAlt"></button>
        <button class="card-btn" id="cardMain"></button>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
